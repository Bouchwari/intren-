name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-timeout

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # A per-test timeout prevents a blocking Qt dialog from leaving the
        # runner silent. Compact output keeps 500+ Windows tests reasonably fast.
        run: python -m pytest -q --timeout=90 --timeout-method=thread

      - name: Build portable executable
        run: pyinstaller --clean --noconfirm Matama.spec

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc installer\TadbirInternat.iss

      - name: Upload testable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tadbir-Internat-Windows
          path: |
            dist/TadbirInternat.exe
            installer_output/TadbirInternatSetup.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/TadbirInternat.exe installer_output/TadbirInternatSetup.exe --notes-file RELEASE_NOTES.md --title "Tadbir Internat ${{ github.ref_name }}"

      - name: Revise previous release descriptions
        if: github.ref == 'refs/tags/v1.5.6'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.request

          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}

          def request(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=headers,
                                           method='PATCH' if body is not None else 'GET')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          removals = {
              'v1.5.3': ('- تفضيلات التقرير اليومي:',),
              'v1.3.1': ('- جعل التقييم', '- السماح فقط لبندي', '- إبقاء **جيدة**'),
              'v1.1.0': ('- تحسين التوليد الشهري للغياب', '- الحفاظ على التقدير'),
          }
          for tag, prefixes in removals.items():
              release = request('/releases/tags/' + tag)
              original = release.get('body') or ''
              revised = '\n'.join(line for line in original.splitlines()
                                  if not line.startswith(prefixes))
              if revised != original.replace('\r\n', '\n').rstrip('\n'):
                  path = '/releases/' + str(release['id'])
                  request(path, {'body': revised})
                  if request(path)['body'] != revised:
                      raise RuntimeError('Release description verification failed for ' + tag)
                  print('Updated description for ' + tag)
