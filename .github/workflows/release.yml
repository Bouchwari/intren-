name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-timeout

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # Verbose names and a per-test timeout make a blocking Qt dialog
        # diagnosable instead of leaving a silent Windows runner for hours.
        run: python -m pytest -vv --timeout=90 --timeout-method=thread

      - name: Build portable executable
        run: pyinstaller --clean --noconfirm Matama.spec

      - name: Upload testable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matama-Windows
          path: dist/Matama.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Matama.exe --generate-notes --title "Matama ${{ github.ref_name }}"
